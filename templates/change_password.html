{% extends "base.html" %}
{% block title %}{{ t('change_pw_title') }}{% endblock %}
{% block content %}

<div class="auth-card">
  <h1>{{ t('change_pw_title') }}</h1>
  <form action="{{ url_for('change_password') }}" method="post" class="form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <label>{{ t('f_current_pw') }}
      <input type="password" name="current_password" required autocomplete="current-password">
    </label>
    <label>{{ t('f_new_pw') }}
      <input type="password" name="new_password" required minlength="4" autocomplete="new-password">
    </label>
    <label>{{ t('f_confirm_pw') }}
      <input type="password" name="confirm_password" required minlength="4" autocomplete="new-password">
    </label>
    <button class="btn btn-block btn-lg btn-green" type="submit">{{ t('btn_save') }}</button>
    <a class="btn btn-block btn-outline" href="{{ url_for('dashboard') }}">{{ t('btn_cancel') }}</a>
  </form>
</div>

{% endblock %}
